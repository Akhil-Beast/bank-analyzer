services:
  # -------------------------------------------------------------
  # Python FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: bank-analyzer-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        value: https://rxarnxvigaoglttcesau.supabase.co
      - key: SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4YXJueHZpZ2FvZ2x0dGNlc2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MzY1NjQsImV4cCI6MjEwNzAxMjU2NH0.WwAdo6V5_tMTkkZeon_GlHDT0K-cGVSRVqp-qae9fxc
      - key: PYTHON_VERSION
        value: 3.11.9

  # -------------------------------------------------------------
  # Next.js Frontend Static Service
  # -------------------------------------------------------------
  - type: web
    name: bank-analyzer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://rxarnxvigaoglttcesau.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4YXJueHZpZ2FvZ2x0dGNlc2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MzY1NjQsImV4cCI6MjEwNzAxMjU2NH0.WwAdo6V5_tMTkkZeon_GlHDT0K-cGVSRVqp-qae9fxc
      - key: NEXT_PUBLIC_API_URL
        value: https://bank-analyzer-backend.onrender.com
