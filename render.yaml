services:
  # -------------------------------------------------------------
  # Python FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: bank-analyzer-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # -------------------------------------------------------------
  # Next.js Frontend Service
  # -------------------------------------------------------------
  - type: web
    name: bank-analyzer-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bank-analyzer-backend
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: bank-analyzer-backend
          property: host
      - key: NODE_VERSION
        value: 20.11.0
