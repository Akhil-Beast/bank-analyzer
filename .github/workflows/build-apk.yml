name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync Capacitor Web Assets
        working-directory: frontend
        run: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Bank Statement Analyzer</title>
            <style>
              body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
              .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <h2>Bank Statement Analyzer</h2>
            <p>Connecting to Cloud Services...</p>
            <script>
              window.location.href = "https://bank-analyzer-frontend.onrender.com";
            </script>
          </body>
          </html>
          EOF
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Clarity
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankAnalyzer-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Bank Analyzer Android App (Latest Release)"
          body: |
            ### 📱 Bank Statement Analyzer Mobile App
            
            Installable native Android APK build.
            - **Cloud Backend:** Render & Supabase
            - **Live 24/7:** Runs continuously without requiring local PC to be on.
            - **Direct Download:** Download `BankAnalyzer-debug.apk` directly below to your Android device.
          files: frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
