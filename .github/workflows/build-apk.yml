name: Build Android APK (Cloud CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Clarity
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankAnalyzer-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Bank Analyzer Android App (Latest Release)"
          body: |
            ### 📱 Bank Statement Analyzer Mobile App
            
            Installable native Android APK build.
            - **Cloud Backend:** Render & Supabase
            - **Live 24/7:** Runs continuously without requiring local PC to be on.
            - **Direct Download:** Download `BankAnalyzer-debug.apk` directly below to your Android device.
          files: frontend/android/app/build/outputs/apk/debug/BankAnalyzer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
